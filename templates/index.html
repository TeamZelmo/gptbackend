<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT UPI - Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #333; text-align: center; }
    .card { background: #fafafa; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    input, button { padding: 10px; font-size: 14px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; }
    input { width: 60%; }
    button { background: #10a37f; color: white; border: none; cursor: pointer; font-weight: bold; width: 35%; }
    button:hover { background: #0d8c6d; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
    th { background: #10a37f; color: white; }
    .msg { margin-top: 10px; font-size: 13px; color: green; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>API Key Admin Dashboard</h2>

    <!-- Generate Key Section -->
    <div class="card">
      <h3>Generate New API Key</h3>
      <label>Set Usage Limit:</label><br>
      <input type="number" id="limitInput" value="5" min="1">
      <button onclick="generateKey()">Create Key</button>
      <div id="genMsg" class="msg"></div>
    </div>

    <!-- Keys List Section -->
    <div class="card">
      <h3>Active API Keys Status</h3>
      <button onclick="loadKeys()" style="width: 100%; margin-bottom: 10px;">Refresh Keys List</button>
      <table>
        <thead>
          <tr>
            <th>API Key</th>
            <th>Limit</th>
            <th>Used</th>
            <th>Remaining</th>
          </tr>
        </thead>
        <tbody id="keysTableBody">
          <tr><td colspan="4" style="text-align:center;">Click Refresh to load keys</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = "http://127.0.0.1:8000";

    async function loadKeys() {
      try {
        const response = await fetch(`${BACKEND_URL}/admin/keys`);
        const data = await response.json();
        
        if(data.status === "success") {
          const tbody = document.getElementById('keysTableBody');
          tbody.innerHTML = "";
          
          for (const [key, info] of Object.entries(data.keys)) {
            const remaining = info.limit - info.used;
            const row = `<tr>
              <td><code>${key}</code></td>
              <td>${info.limit}</td>
              <td>${info.used}</td>
              <td>${remaining}</td>
            </tr>`;
            tbody.innerHTML += row;
          }
        }
      } catch (err) {
        alert("Failed to connect to backend server!");
      }
    }

    async function generateKey() {
      const limit = document.getElementById('limitInput').value;
      const msgDiv = document.getElementById('genMsg');
      
      try {
        const response = await fetch(`${BACKEND_URL}/generate-key`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ limit: parseInt(limit) })
        });
        
        const data = await response.json();
        if(response.ok) {
          msgDiv.style.color = "green";
          msgDiv.innerText = `Key Created: ${data.api_key}`;
          loadKeys(); // Auto refresh table
        } else {
          msgDiv.style.color = "red";
          msgDiv.innerText = "Error generating key";
        }
      } catch (err) {
        msgDiv.style.color = "red";
        msgDiv.innerText = "Connection failed!";
      }
    }

    // Page load hote hi keys load karein
    window.onload = loadKeys;
  </script>

</body>
</html>
